name: Build and deploy Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: restore-wiki
        uses: actions/cache/restore@v4
        with:
          path: |
            public/wiki-data
            public/wiki-assets
          key: wiki-content-${{ github.run_id }}
          restore-keys: |
            wiki-content-
      - id: sync-wiki
        continue-on-error: true
        run: npm run sync:wiki
      - if: steps.sync-wiki.outcome == 'failure'
        run: echo "原站同步失败，已部署最近缓存的内容包或仓库内的镜像占位页。" >> $GITHUB_STEP_SUMMARY
      - run: npm run build
      - name: Verify deployment content package
        run: >-
          node --input-type=module -e "import { readFile, stat } from 'node:fs/promises'; const index = JSON.parse(await readFile('dist/wiki-data/index.json', 'utf8')); const home = index.pages.find((page) => page.title === '来福Simulation Wiki') ?? index.pages[0]; if (!home?.file && !home?.slug) throw new Error('内容包未包含首页条目'); const file = home.file ?? home.slug + '.json'; await stat('dist/wiki-data/pages/' + file); console.log('Verified homepage content:', file);"
      - if: steps.sync-wiki.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            public/wiki-data
            public/wiki-assets
          key: wiki-content-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4