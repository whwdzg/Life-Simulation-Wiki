name: Build and deploy wiki mirror

on:
  push:
    branches: [main]
  schedule:
    # 每小时 :17（UTC）运行；避开整点高峰，GitHub 仍可能延迟。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute media cache signature
        run: node scripts/media-signature.mjs > media-signature.txt
        env:
          WIKI_USER_AGENT: LifeSimulationWikiMirror/1.0 (+https://github.com/${{ github.repository }})

      - name: Restore media cache
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: wiki-media-v1-${{ hashFiles('media-signature.txt') }}
          restore-keys: |
            wiki-media-v1-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static mirror
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Validate generated site
        run: npm run check
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
