<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="来福Simulation Wiki 的非官方静态镜像站" />
    <link id="site-favicon" rel="icon" href="https://static.wikia.nocookie.net/lifesimulation/images/e/e6/Site-logo.png/revision/latest?cb=20251002013153&path-prefix=zh" />
    <link rel="preload" href="./wiki-data/index.json" as="fetch" crossorigin="anonymous" />
    <title>来福Simulation Wiki（镜像站）</title>
    <script type="module" crossorigin src="./assets/index-Dua50WMR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-GDhgMeDR.css">
  </head>
  <body>
    <div id="app"><main class="load-state loading-state" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><h1>正在加载页面</h1><p>正在获取 Wiki 内容，请稍候。</p></main></div>
    <script>
      window.setTimeout(() => {
        if (window.__lifeSimulationWikiStarted) return
        document.querySelector('#app').innerHTML = '<main class="load-state"><h1>镜像站部署配置错误</h1><p>构建后的静态资源未能启动。请在 GitHub 仓库的 Settings > Pages > Build and deployment 中选择 GitHub Actions。</p></main>'
      }, 6000)
    </script>
  </body>
</html>
